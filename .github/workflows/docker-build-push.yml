name: Build and Push Docker Image

on:
  push:
    branches: [ main, master, '1.*' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend with Maven
        run: >-
          ./mvnw -B install
          -D"maven.test.skip"=true
          -D"checkstyle.skip"=true
          -D"license.skipAddThirdParty"=true
          -D"spotless.check.skip"=true
          -D"http.keepAlive"=false
          -D"maven.wagon.http.pool"=false
          -D"maven.wagon.http.retryHandler.count"=3
          -D"maven.wagon.httpconnectionManager.ttlSeconds"=120

      - name: Prepare Docker build context
        run: |
          # Debug: show all target directories
          echo "=== Find all target directories ==="
          find . -type d -name "target" | head -20
          echo ""
          echo "=== seatunnel-web-dist/target contents ==="
          ls -la seatunnel-web-dist/target/ 2>/dev/null || echo "seatunnel-web-dist/target not found"
          echo ""
          echo "=== Find apache-seatunnel-web directories ==="
          find . -type d -name "apache-seatunnel-web*" 2>/dev/null || echo "No apache-seatunnel-web directory found"
          echo ""
          # Rename versioned directory to fixed name for Docker build
          if [ -d "seatunnel-web-dist/target" ]; then
            cd seatunnel-web-dist/target
            mv apache-seatunnel-web-*/ seatunnel-web
          else
            echo "ERROR: seatunnel-web-dist/target directory not found!"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend.dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max